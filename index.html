<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Granular Wealth Architect v4.3</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; color: #1e293b; line-height: 1.4; }
        .container { max-width: 98%; margin: 0 auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .controls-top { display: flex; gap: 15px; background: #1e293b; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        
        /* Updated Grid to smooth wrapping flexbox cards */
        .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1 1 480px; min-width: 320px; border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; background: #fff; position: relative; border-top: 5px solid #64748b; }
        
        .re-card { border-top-color: #f59e0b; } .inv-card { border-top-color: #10b981; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #ef4444; border: none; border-radius: 4px; cursor: pointer; padding: 2px 8px; font-weight: bold; }
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-top: 8px; }
        input { width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        
        .flow-manager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .flow-zone { background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; }
        .flow-zone strong { font-size: 11px; display: block; margin-bottom: 5px; color: #334155; border-bottom: 1px solid #cbd5e1; }
        .event-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
        .btn-action { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 9px; margin-top: 5px; width: 100%; }
        .btn-add-in { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .btn-add-out { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .btn-run { background: #2563eb; color: white; padding: 12px 40px; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-run:hover { background: #1d4ed8; }

        .table-wrap { overflow-x: auto; margin-top: 25px; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; min-width: 1900px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 3px; text-align: center; }
        th { background: #f8fafc; position: sticky; top: 0; z-index: 10; font-size: 10px; }
        .header-main { background: #334155 !important; color: white; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .lump-hit { background: #fffbeb; font-weight: bold; color: #b45309; }
        .cont-hit { background: #f0fdf4; font-weight: bold; color: #166534; }
        .interest-col { color: #2563eb; background: #f0f7ff; font-weight: 600; }
        .shadow-wd { background: #f0fdfa; color: #0d9488; font-weight: bold; }
        .total-col { background: #f1f5f9; font-weight: 900; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Omnibus Wealth Architect <span style="font-size:0.5em; font-weight:normal; color:#64748b">| Edition 4.3: Responsive Multi-Card Architecture</span></h2>
    
    <div class="controls-top">
        <div><label style="color:white">Current Age</label><input type="number" id="curAge" value="45" style="width:70px"></div>
        <div><label style="color:white">Simulation End Age</label><input type="number" id="tarAge" value="90" style="width:70px"></div>
        <button class="btn-action" style="background:#f59e0b; color:white; font-size: 12px; width: auto; padding: 10px 20px;" onclick="addProperty()">+ Add Property (Smith)</button>
        <button class="btn-action" style="background:#10b981; color:white; font-size: 12px; width: auto; padding: 10px 20px;" onclick="addInvestment()">+ Add Investment Account</button>
        <div style="flex-grow: 1;"></div>
        <button class="btn-run" onclick="runSim()">🚀 Run Complete Simulation</button>
    </div>

    <div id="accountsContainer" class="grid"></div>
    <div id="output" class="table-wrap"></div>
</div>

<script>
function addProperty() {
    const div = document.createElement('div');
    div.className = 'card re-card';
    div.dataset.type = 'RE';
    div.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">Remove</button>
        <strong>🏠 Property & Smith Flywheel</strong>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <div><label>Home Value ($)</label><input type="number" class="reVal" value="900000"></div>
            <div><label>Mortgage Debt ($)</label><input type="number" class="reDebt" value="400000"></div>
            <div><label>Mortgage Rate (%)</label><input type="number" class="reRate" value="5.0"></div>
            <div><label>Portfolio Return (%)</label><input type="number" class="smRate" value="8.0"></div>
        </div>
        <div style="margin-top:10px; padding:8px; background:#fffbeb; border:1px dashed #f59e0b; border-radius:6px;">
            <label style="color:#b45309; margin-top:0;">⚡ Extra Monthly Prepayment ($)</label>
            <input type="number" class="rePrepay" value="0" placeholder="e.g. 500">
        </div>
    `;
    document.getElementById('accountsContainer').appendChild(div);
}

function addInvestment() {
    const div = document.createElement('div');
    div.className = 'card inv-card';
    div.dataset.type = 'INV';
    div.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">Remove</button>
        <strong>💰 Investment Account</strong>
        <input type="text" class="invName" value="Asset Name" style="font-weight:bold; border:none; border-bottom:1px solid #ccc; margin-bottom:10px; font-size: 1.1rem;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
            <div><label>Initial Balance ($)</label><input type="number" class="invBal" value="250000"></div>
            <div><label>Annual Return (%)</label><input type="number" class="invRate" value="7.0"></div>
        </div>
        <div class="flow-manager">
            <div class="flow-zone">
                <strong>(+) CONTRIBUTIONS</strong>
                <div class="in-container"></div>
                <button class="btn-action btn-add-in" onclick="addRow(this, 'IN')">+ Add Age/Amt</button>
            </div>
            <div class="flow-zone">
                <strong>(-) WITHDRAWALS</strong>
                <div class="out-container"></div>
                <button class="btn-action btn-add-out" onclick="addRow(this, 'OUT')">+ Add Age/Amt</button>
            </div>
        </div>
    `;
    document.getElementById('accountsContainer').appendChild(div);
}

function addRow(btn, type) {
    const container = btn.previousElementSibling;
    const row = document.createElement('div');
    row.className = 'event-row';
    row.dataset.flowType = type;
    row.innerHTML = `
        <input type="number" class="evAge" placeholder="Age" style="width:45px">
        <input type="number" class="evAmt" placeholder="Amt $" style="width:85px">
        <button class="remove-btn" style="position:static; padding: 2px 5px;" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(row);
}

function getSustainableWD(P, r, n, events, futureAge) {
    if (n <= 0) return P;
    let r_dec = r / 100;
    let netPV = 0;
    events.forEach(ev => {
        if (ev.age > futureAge && ev.age < (futureAge + n)) {
            let pv = ev.amt / Math.pow(1 + r_dec, ev.age - futureAge);
            netPV += (ev.type === 'OUT' ? -pv : pv);
        }
    });
    let adjP = Math.max(0, P + netPV);
    if (r_dec === 0) return adjP / n;
    return (adjP * (r_dec * Math.pow(1 + r_dec, n)) / (Math.pow(1 + r_dec, n) - 1)) / (1 + r_dec);
}

function fmt(v) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v); }

function runSim() {
    const startAge = parseInt(document.getElementById('curAge').value);
    const endAge = parseInt(document.getElementById('tarAge').value);
    const accounts = document.querySelectorAll('.card');
    
    let processedAccounts = Array.from(accounts).map(acc => {
        if (acc.dataset.type === 'RE') {
            const mDebt = parseFloat(acc.querySelector('.reDebt').value);
            const mRateM = (parseFloat(acc.querySelector('.reRate').value) / 100) / 12;
            return {
                type: 'RE', hVal: parseFloat(acc.querySelector('.reVal').value),
                mDebt, mRateM, mPay: mDebt * (mRateM * Math.pow(1 + mRateM, 300)) / (Math.pow(1 + mRateM, 300) - 1),
                prepay: parseFloat(acc.querySelector('.rePrepay').value || 0),
                sBal: 0, sDebt: 0, smRate: parseFloat(acc.querySelector('.smRate').value)
            };
        } else {
            const events = [];
            acc.querySelectorAll('.event-row').forEach(row => {
                events.push({
                    age: parseInt(row.querySelector('.evAge').value),
                    amt: parseFloat(row.querySelector('.evAmt').value || 0),
                    type: row.dataset.flowType
                });
            });
            return {
                type: 'INV', name: acc.querySelector('.invName').value,
                bal: parseFloat(acc.querySelector('.invBal').value),
                rate: parseFloat(acc.querySelector('.invRate').value),
                events: events
            };
        }
    });

    let html = `<table><thead><tr><th class="header-main">Age</th>`;
    processedAccounts.forEach(a => {
        if (a.type === 'RE') html += `<th colspan="5" class="header-main">Smith Flywheel Property</th>`;
        else html += `<th colspan="6" class="header-main">${a.name}</th>`;
    });
    html += `<th class="header-main total-col">TOTAL NET WORTH</th></tr><tr><th>-</th>`;
    
    processedAccounts.forEach(a => {
        if (a.type === 'RE') html += `<th>Equity</th><th>Portfolio</th><th>Yr Return</th><th>Max WD</th><th>HELOC</th>`;
        else html += `<th>Open Balance</th><th>Interest</th><th>Shadow Max WD</th><th>(+) Additions</th><th>(-) Withdrawals</th><th>Closing</th>`;
    });
    html += `<th>Combined</th></tr></thead><tbody>`;

    for (let age = startAge; age <= endAge; age++) {
        let totalNW = 0;
        html += `<tr><td><b>${age}</b></td>`;
        
        processedAccounts.forEach(a => {
            if (a.type === 'RE') {
                totalNW += (a.hVal - a.mDebt) + (a.sBal - a.sDebt);
                let interestEarned = a.sBal * (a.smRate / 100);
                let shadowWD = getSustainableWD(a.sBal, a.smRate, endAge - age, [], age);
                html += `<td>${fmt(a.hVal - a.mDebt)}</td>
                         <td>${fmt(a.sBal)}</td>
                         <td class="interest-col">${fmt(interestEarned)}</td>
                         <td class="shadow-wd">${fmt(shadowWD)}</td>
                         <td class="neg">${fmt(a.sDebt)}</td>`;
            } else {
                let currentEvents = a.events.filter(e => e.age === age);
                let totalIn = currentEvents.filter(e => e.type === 'IN').reduce((sum, e) => sum + e.amt, 0);
                let totalOut = currentEvents.filter(e => e.type === 'OUT').reduce((sum, e) => sum + e.amt, 0);
                
                totalNW += a.bal;
                let interestEarned = a.bal * (a.rate / 100);
                let shadowWD = getSustainableWD(a.bal, a.rate, endAge - age, a.events, age);
                let closing = (a.bal + interestEarned) + totalIn - totalOut;

                html += `<td>${fmt(a.bal)}</td>
                         <td class="interest-col">${fmt(interestEarned)}</td>
                         <td class="shadow-wd">${fmt(shadowWD)}</td>
                         <td class="${totalIn > 0 ? 'cont-hit' : ''}">${totalIn > 0 ? '+' + fmt(totalIn) : '-'}</td>
                         <td class="${totalOut > 0 ? 'lump-hit' : ''}">${totalOut > 0 ? '-' + fmt(totalOut) : '-'}</td>
                         <td style="background:#f8fafc; font-weight:bold;">${fmt(closing)}</td>`;
                
                a.bal = closing < 0 ? 0 : closing;
            }
        });
        html += `<td class="total-col">${fmt(totalNW)}</td></tr>`;

        // Advance Smith Model Logic
        processedAccounts.filter(a => a.type === 'RE').forEach(a => {
            a.hVal *= 1.03;
            for (let m = 0; m < 12; m++) {
                if (a.mDebt > 0) {
                    let mInt = a.mDebt * a.mRateM;
                    let mPrin = Math.min(a.mDebt, a.mPay - mInt);
                    a.mDebt -= mPrin;
                    let extraApplied = Math.min(a.mDebt, a.prepay);
                    a.mDebt -= extraApplied;
                    let growth = a.sBal * (a.smRate/1200);
                    a.mDebt = Math.max(0, a.mDebt - growth);
                    let totalP = mPrin + extraApplied + growth;
                    a.sDebt += totalP; a.sBal += totalP + (a.sBal * (a.smRate/1200));
                } else { a.sBal *= (1 + a.smRate/1200); }
            }
        });
    }
    document.getElementById('output').innerHTML = html + `</tbody></table>`;
}
window.onload = () => { addProperty(); addInvestment(); runSim(); };
</script>
</body>
</html>
